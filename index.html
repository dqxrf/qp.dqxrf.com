<!DOCTYPE html>
<html>

	<head>
		<meta charset="UTF-8">
		<title></title>
		<style>
			*{padding: 0;margin: 0;}
			ul {
				list-style: none;
			}
			
			.mian {
				width: 1200px;
				margin: auto;
			}
			
			.list-cont {
				height: 40px;
				margin:7% auto;
				width: 838px;
			}
			
			.list-cont ul li {
				float: left;
				margin-right: 48px;
				border: solid 1px #E4E4E4;
				background: #fff;
				cursor: pointer;
				padding: 17px 38px;
				border-radius: 4px;
			}
			.list-cont ul li img{
				width: 30px;
			    height: 30px;
			    display: block;
			    margin-right: 5px;
			    float: left;
			    margin-top: -4px;
			}
			
			.list-cont ul li a {
				text-decoration: none;
				color: #333;
				cursor: pointer;
				color: #FFFFFF;
				font-weight: bold;
			}
			
			.logo {
				margin: 3% auto;
				width: 159px;
			}
			
			.effect {
				position: relative;
				-webkit-box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3), 0 0 40px rgba(0, 0, 0, 0.1) inset;
				-moz-box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3), 0 0 40px rgba(0, 0, 0, 0.1) inset;
				box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3), 0 0 40px rgba(0, 0, 0, 0.1) inset;
			}
			
			.effect::before,
			.effect::after {
				content: "";
				position: absolute;
				z-index: -1;
				-webkit-box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
				-moz-box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
				box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
				top: 50%;
				bottom: 0;
				left: 10px;
				right: 10px;
				-moz-border-radius: 100px / 10px;
				border-radius: 100px / 10px;
			}
			
			.ban {
				width: 1000px;
				margin: auto;
			}
			.banner{width: 100%;height: 242px;background: #2f70fc;}
		</style>
	</head>

	<body>
		<div class="mian">
			<div class="logo"><img src="/7.png" style="width: 155px;"></div>
		</div>
		<div class="banner">
			<div class="ban"><img src="249.jpg"></div>
		</div>
			
		<div class="mian">
			<div class="list-cont">
				<ul>
					<li class="effect" style="background: #2f70fc;">
						<a href="http://47.99.243.140:901" target="_blank" title=" 黑龙江省车用气瓶信息监管系统"> 车用气瓶</a>
					</li>
					<li class="effect" style="background: #f9832d;">
						
						<a href="http://47.99.243.140:902" target="_blank" title="黑龙江省民用气瓶信息监管系统"> 民用气瓶</a>
					</li>
					<li class="effect" style="background: #2f70fc;">
						
						<a href="http://47.99.243.140:903" target="_blank" title="黑龙江省工业气瓶信息监管系统"> 工业气瓶</a>
					</li>
					<li class="effect" style="background: #f9832d;">
						<a href="http://47.99.243.140:9100/" target="_blank" title="黑龙江省气瓶信息监管系统"> 税控系统</a>
					</li>
				</ul>
			</div>
		</div>

	</body>

</html>
